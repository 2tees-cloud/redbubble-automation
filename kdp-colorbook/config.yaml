# Порядок в списке = приоритет. Первый живой провайдер отвечает, при ошибке — следующий.
# Ключи НЕ пишем сюда, только имя переменной из .env. Нет ключа в .env — провайдер пропускается.
# Названия моделей у провайдеров меняются: проверить актуальные — python scripts/check_router.py --models
# json_mode: true  — для chat_json отправлять response_format=json_object (провайдер должен поддерживать)
# extra_body: {...} — добавить поля в тело запроса (выключить thinking и т.п.)
# vision_model: ...  — модель, которая видит картинки (для проверки страниц); нет поля — провайдер не проверяет

log_level: INFO
timeout: 120
state_db: data/router_state.db

text_providers:
  - name: gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    model: gemini-2.5-flash
    vision_model: gemini-2.5-flash
    key_env: GEMINI_API_KEY
    json_mode: true
    # 2.5-flash «думает», и токены размышлений съедают max_tokens → пустой ответ. Выключаем.
    extra_body: {reasoning_effort: none}
  - name: groq
    base_url: https://api.groq.com/openai/v1
    model: llama-3.3-70b-versatile
    vision_model: meta-llama/llama-4-scout-17b-16e-instruct
    key_env: GROQ_API_KEY
    json_mode: true
  - name: cerebras
    base_url: https://api.cerebras.ai/v1
    model: gpt-oss-120b
    key_env: CEREBRAS_API_KEY
    json_mode: true
    extra_body: {reasoning_effort: low}
  - name: zai
    base_url: https://api.z.ai/api/paas/v4
    model: glm-4.5-flash
    key_env: ZAI_API_KEY
    extra_body: {thinking: {type: disabled}}
  - name: mistral
    base_url: https://api.mistral.ai/v1
    model: mistral-small-latest
    vision_model: mistral-small-latest
    key_env: MISTRAL_API_KEY
    json_mode: true
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    model: meta-llama/llama-3.3-70b-instruct:free
    key_env: OPENROUTER_API_KEY
  - name: xai
    base_url: https://api.x.ai/v1
    model: grok-3-mini
    key_env: XAI_API_KEY

image_providers:
  - name: cloudflare_flux
    type: cloudflare
    model: "@cf/black-forest-labs/flux-1-schnell"
    steps: 8
    key_env: CF_API_TOKEN
    account_env: CF_ACCOUNT_ID
  - name: huggingface_flux
    type: huggingface
    model: black-forest-labs/FLUX.1-schnell
    key_env: HF_TOKEN
  - name: pollinations
    type: pollinations
    key_optional: true          # работает и без ключа, но с жёстким лимитом
    key_env: POLLINATIONS_TOKEN
    model: flux
    url_template: "https://image.pollinations.ai/prompt/{prompt}?width={width}&height={height}&seed={seed}&model={model}&nologo=true"
  # Пример любого OpenAI-совместимого генератора картинок:
  # - name: my_images
  #   type: openai_images
  #   base_url: https://api.example.com/v1
  #   model: some-image-model
  #   key_env: MY_IMAGES_KEY

# Постобработка страниц: картинка → чистые векторные линии → PDF для KDP
postprocess:
  upscale: 2          # увеличение перед порогом — точнее края
  threshold: null     # null = авто (Otsu, не светлее 200: светло-серые тени уходят в белое)
  close_gaps: 0       # >0 закрывает разрывы в контурах (px), чтобы области было удобно раскрашивать
  smooth: 1.0         # сглаживание кривых: 0 — ломаные, 1.0 — норма, 1.33 — очень плавно
book:
  trim: [8.5, 11]     # формат в дюймах
  margin: 0.5         # внешние поля, дюймы
  blank_backs: true   # картинки только на правых страницах

# Фильтр брака (core/quality.py). Для взрослых раскрасок поднять max_regions, max_ink, max_tiny.
quality:
  min_ink: 0.02           # доля линий: меньше — пустая страница
  max_ink: 0.30           #             больше — каша или тёмный фон
  max_solid: 0.04         # сплошная чёрная заливка (её не раскрасить)
  min_regions: 6          # областей для раскрашивания
  max_regions: 400
  max_tiny: 0.15          # доля белого в ячейках мельче карандаша
  max_edge_ink: 0.15      # линии на самом краю картинки
  dup_distance: 10        # похожесть на уже принятую страницу (0..64, меньше — строже)
  min_vision_score: 7     # оценка vision-модели 1..10
  vision_required: false  # true: без работающего vision страницы не принимаются

# Шаблон промпта страницы ({subject}, {age}). Пусто — встроенный из core/pipeline.py
page_prompt:
